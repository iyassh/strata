# Canonical sensor name -> LBNL DDAHU CSV column name (X17 onboarding,
# written from the documentation's Table 2 only). Naming conventions kept
# so the generic tooling recognises roles: positions end in _POS, commands
# in _CMD, setpoints in _SP, flows contain FLOW, statuses contain STATUS.
canonical_to_csv:
  # --- AHU level: air side ---
  OA_TEMP: OA_TEMP
  MA_TEMP: MA_TEMP
  RA_TEMP: RA_TEMP
  OA_DMPR_POS: OA_DMPR
  OA_DMPR_CMD: OA_DMPR_DM
  RA_DMPR_POS: RA_DMPR
  RA_DMPR_CMD: RA_DMPR_DM
  EA_DMPR_POS: EA_DMPR
  EA_DMPR_CMD: EA_DMPR_DM
  OCCUPIED: SYS_CTL             # three-state: 0=shutdown, 1=operate, 2=setback
  Datetime: Datetime
  # --- cold deck (mapped to the SA_* canonical names the AHU rules use) ---
  SA_TEMP: CSA_TEMP
  SA_TEMP_SP: CSA_TEMPSPT
  CSA_STATIC: CSA_SP
  CSA_STATIC_SP: CSA_SPSPT
  CSF_STATUS: CSF_CS
  CSF_SPEED: CSF_SPD
  CHWC_VLV_POS: CHWC_VLV
  CHWC_VLV_CMD: CHWC_VLV_DM
  CHWC_EWT: CHWC_EWT
  CHWC_LWT: CHWC_LWT
  CHWC_FLOW: CHWP_GPMC
  CHWC_DAT: CHWC_DAT
  # --- hot deck ---
  HSA_TEMP: HSA_TEMP
  HSA_TEMP_SP: HSA_TEMPSPT
  HSA_STATIC: HSA_SP
  HSA_STATIC_SP: HSA_SPSPT
  HSF_STATUS: HSF_CS
  HSF_SPEED: HSF_SPD
  HWC_VLV_POS: HWC_VLV
  HWC_VLV_CMD: HWC_VLV_DM
  HWC_EWT: HWC_EWT
  HWC_LWT: HWC_LWT
  HWC_FLOW: HWP_GPMC
  HWC_DAT: HWC_DAT
  RF_SPEED: RF_SPD
  # --- zone mixing boxes (W, SB, SA, E): command-only dampers, measured flows ---
  ZONE_TEMP_W: RM_TEMP_W
  ZONE_CLG_SP_W: RMCLGSPT_W
  ZONE_HTG_SP_W: RMHTGSPT_W
  ZONE_DAT_W: VAV_DAT_W
  ZONE_DMPR_C_CMD_W: VAV_DMPR_C_W
  ZONE_DMPR_H_CMD_W: VAV_DMPR_H_W
  ZONE_FLOW_C_W: VAVCFM_C_W
  ZONE_FLOW_C_SP_W: VAVCFM_C_DM_W
  ZONE_FLOW_H_W: VAVCFM_H_W
  ZONE_FLOW_H_SP_W: VAVCFM_H_DM_W
  ZONE_FLOW_T_W: VAVCFM_T_W
  ZONE_TEMP_SB: RM_TEMP_SB
  ZONE_CLG_SP_SB: RMCLGSPT_SB
  ZONE_HTG_SP_SB: RMHTGSPT_SB
  ZONE_DAT_SB: VAV_DAT_SB
  ZONE_DMPR_C_CMD_SB: VAV_DMPR_C_SB
  ZONE_DMPR_H_CMD_SB: VAV_DMPR_H_SB
  ZONE_FLOW_C_SB: VAVCFM_C_SB
  ZONE_FLOW_C_SP_SB: VAVCFM_C_DM_SB
  ZONE_FLOW_H_SB: VAVCFM_H_SB
  ZONE_FLOW_H_SP_SB: VAVCFM_H_DM_SB
  ZONE_FLOW_T_SB: VAVCFM_T_SB
  ZONE_TEMP_SA: RM_TEMP_SA
  ZONE_CLG_SP_SA: RMCLGSPT_SA
  ZONE_HTG_SP_SA: RMHTGSPT_SA
  ZONE_DAT_SA: VAV_DAT_SA
  ZONE_DMPR_C_CMD_SA: VAV_DMPR_C_SA
  ZONE_DMPR_H_CMD_SA: VAV_DMPR_H_SA
  ZONE_FLOW_C_SA: VAVCFM_C_SA
  ZONE_FLOW_C_SP_SA: VAVCFM_C_DM_SA
  ZONE_FLOW_H_SA: VAVCFM_H_SA
  ZONE_FLOW_H_SP_SA: VAVCFM_H_DM_SA
  ZONE_FLOW_T_SA: VAVCFM_T_SA
  ZONE_TEMP_E: RM_TEMP_E
  ZONE_CLG_SP_E: RMCLGSPT_E
  ZONE_HTG_SP_E: RMHTGSPT_E
  ZONE_DAT_E: VAV_DAT_E
  ZONE_DMPR_C_CMD_E: VAV_DMPR_C_E
  ZONE_DMPR_H_CMD_E: VAV_DMPR_H_E
  ZONE_FLOW_C_E: VAVCFM_C_E
  ZONE_FLOW_C_SP_E: VAVCFM_C_DM_E
  ZONE_FLOW_H_E: VAVCFM_H_E
  ZONE_FLOW_H_SP_E: VAVCFM_H_DM_E
  ZONE_FLOW_T_E: VAVCFM_T_E
