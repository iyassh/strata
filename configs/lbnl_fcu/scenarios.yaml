  - {file: FCU_VLVStuck_Heating_50, family: valve_stuck, label: "heating valve stuck 50%", is_fault: true}
  - {file: FCU_VLVStuck_Heating_80, family: valve_stuck, label: "heating valve stuck 80%", is_fault: true}
  - {file: FCU_VLVStuck_Heating_100, family: valve_stuck, label: "heating valve stuck 100%", is_fault: true}
  - {file: FCU_VLVLeak_Cooling_20, family: valve_leak, label: "cooling valve leaking 20%", is_fault: true}
  - {file: FCU_VLVLeak_Cooling_50, family: valve_leak, label: "cooling valve leaking 50%", is_fault: true}
  - {file: FCU_VLVLeak_Cooling_80, family: valve_leak, label: "cooling valve leaking 80%", is_fault: true}
  - {file: FCU_VLVStuck_Cooling_0, family: valve_stuck, label: "cooling valve stuck 0%", is_fault: true}
