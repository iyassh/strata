  - {file: FCU_OADMPRLeak_50, family: oa_damper_leak, label: "OA damper leaking 50%", is_fault: true}
  - {file: FCU_OADMPRLeak_80, family: oa_damper_leak, label: "OA damper leaking 80%", is_fault: true}
  - {file: FCU_OADMPRStuck_0, family: oa_damper_stuck, label: "OA damper stuck 0%", is_fault: true}
  - {file: FCU_OADMPRStuck_30, family: oa_damper_stuck, label: "OA damper stuck 30%", is_fault: true}
  - {file: FCU_OADMPRStuck_50, family: oa_damper_stuck, label: "OA damper stuck 50%", is_fault: true}
  - {file: FCU_OADMPRStuck_80, family: oa_damper_stuck, label: "OA damper stuck 80%", is_fault: true}
  - {file: FCU_OADMPRStuck_100, family: oa_damper_stuck, label: "OA damper stuck 100%", is_fault: true}
  - {file: FCU_VLVLeak_Heating_20, family: valve_leak, label: "heating valve leaking 20%", is_fault: true}
  - {file: FCU_VLVLeak_Heating_50, family: valve_leak, label: "heating valve leaking 50%", is_fault: true}
