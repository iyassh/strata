# Event-abstraction rules for the LBNL PFPU dataset (parallel fan-powered
# terminal units, 4 zones I/W/S/E + one AHU with heating AND cooling coils).
#
# Same seven+two rule KINDS as SDAHU — zero code changes; everything below
# is configuration. Thresholds follow the G1 discipline: initial values from
# physics/APAR conventions, then validated (and if needed loosened) against
# the FaultFree year ONLY, via the healthy-silence gate. No fault file is
# consulted.

climate:
  ashrae_zone: 5A
  notes: "Same 2018 simulated year family as SDAHU. Documentation only."

detection:
  fpr_quantile: 0.01
  # oscillation channel (Hagglund-style daily direction-change counts):
  # zone dampers have no command wire and no event vocabulary; hunting is
  # only visible in the position signal itself. Deadband 0.02 = 2% travel.
  oscillation_signals: [ZONE_DMPR_POS_I, ZONE_DMPR_POS_W, ZONE_DMPR_POS_S, ZONE_DMPR_POS_E,
                        ZONE_TEMP_I, ZONE_TEMP_W, ZONE_TEMP_S, ZONE_TEMP_E]
  oscillation_deadband: 0.02
  # temperature reversals below sensor precision are noise (audit B2)
  oscillation_deadbands: {ZONE_TEMP_I: 0.5, ZONE_TEMP_W: 0.5, ZONE_TEMP_S: 0.5, ZONE_TEMP_E: 0.5}
  # sensor-precision floor for the daily residual band (audit: SFPU raw
  # band was 0.22F wide; sub-0.1F exceedances are simulation-grade only)
  residual_min_band_width: 0.5
  residual_min_exceedance: 0.5   # margin floor (audit C1)
  residual_channels: [supply_air_residual, rh_waterside_dT_I, rh_waterside_dT_W,
                      rh_waterside_dT_S, rh_waterside_dT_E,
                      # X33b coverage audit (2026-09-25)
                      sf_specific_power, rf_specific_power, sf_flow_per_speed, static_per_speed2,
                      chwc_waterside_dT, hwc_waterside_dT,
                      ra_minus_zone_I, ra_minus_zone_W, ra_minus_zone_S, ra_minus_zone_E,
                      dat_minus_sa_I, dat_minus_sa_W, dat_minus_sa_S, dat_minus_sa_E,
                      da_minus_pm_I, da_minus_pm_W, da_minus_pm_S, da_minus_pm_E]
  holdout_days_per_month: 8
  # X25: the 8 days before the holdout block calibrate the conformance thresholds,
  # so the holdout is out-of-sample for every channel (discovery trains on the rest)
  calibration_days_per_month: 8

events:
  # ---------------- state alphabet (feeds model discovery) ----------------
  occupancy:
    kind: occupancy
    signal: OCCUPIED           # ==1: occupied
    on_event: system_started
    off_event: system_stopped
    alphabet: state

  night_cycle:
    kind: mode
    signal: OCCUPIED           # ==2: night-cycle operation; mode fires >1.5
    on_above: 1.5
    on_event: night_cycle_started
    off_event: night_cycle_ended
    alphabet: state

  cooling:
    kind: mode
    signal: CHWC_VLV_POS
    on_above: 0.05
    on_event: cooling_active
    off_event: cooling_inactive
    alphabet: state

  heating:
    kind: mode
    signal: HWC_VLV_POS
    on_above: 0.05
    on_event: heating_active
    off_event: heating_inactive
    alphabet: state

  economizer:
    kind: window
    signal: OA_TEMP
    low: 33.8
    high: 60.0
    enter_event: economizer_window_entered
    exit_event: economizer_window_exited
    alphabet: state

  # Zone lifecycles: the parallel fan cycles with heating demand — the
  # signature rhythm of THIS system type (a series fan would run whenever
  # occupied; the discovered models must show that difference on their own).
  zone_fan_I:
    kind: mode
    signal: ZONE_FAN_STATUS_I
    on_above: 0.5
    on_event: zone_fan_I_started
    off_event: zone_fan_I_stopped
    alphabet: state
    stratum: device
    device: TU_I
  zone_fan_W:
    kind: mode
    signal: ZONE_FAN_STATUS_W
    on_above: 0.5
    on_event: zone_fan_W_started
    off_event: zone_fan_W_stopped
    alphabet: state
    stratum: device
    device: TU_W
  zone_fan_S:
    kind: mode
    signal: ZONE_FAN_STATUS_S
    on_above: 0.5
    on_event: zone_fan_S_started
    off_event: zone_fan_S_stopped
    alphabet: state
    stratum: device
    device: TU_S
  zone_fan_E:
    kind: mode
    signal: ZONE_FAN_STATUS_E
    on_above: 0.5
    on_event: zone_fan_E_started
    off_event: zone_fan_E_stopped
    alphabet: state
    stratum: device
    device: TU_E

  zone_heating_I:
    kind: mode
    signal: RH_VLV_POS_I
    on_above: 0.05
    on_event: zone_heating_I_active
    off_event: zone_heating_I_inactive
    alphabet: state
    stratum: device
    device: TU_I
  zone_heating_W:
    kind: mode
    signal: RH_VLV_POS_W
    on_above: 0.05
    on_event: zone_heating_W_active
    off_event: zone_heating_W_inactive
    alphabet: state
    stratum: device
    device: TU_W
  zone_heating_S:
    kind: mode
    signal: RH_VLV_POS_S
    on_above: 0.05
    on_event: zone_heating_S_active
    off_event: zone_heating_S_inactive
    alphabet: state
    stratum: device
    device: TU_S
  zone_heating_E:
    kind: mode
    signal: RH_VLV_POS_E
    on_above: 0.05
    on_event: zone_heating_E_active
    off_event: zone_heating_E_inactive
    alphabet: state
    stratum: device
    device: TU_E

  # ------------- signature alphabet (bypasses discovery) ------------------
  # AHU actuators: command-vs-position (APAR-style; thresholds as SDAHU)
  chwc_valve_mismatch:
    kind: mismatch
    pos: CHWC_VLV_POS
    cmd: CHWC_VLV_CMD
    threshold: 0.05
    sustained_min: 60
  hwc_valve_mismatch:
    kind: mismatch
    pos: HWC_VLV_POS
    cmd: HWC_VLV_CMD
    threshold: 0.05
    sustained_min: 60
  oa_damper_mismatch:
    kind: mismatch
    pos: OA_DMPR_POS
    cmd: OA_DMPR_CMD
    threshold: 0.05
    sustained_min: 60
  ra_damper_mismatch:
    kind: mismatch
    pos: RA_DMPR_POS
    cmd: RA_DMPR_CMD
    threshold: 0.05
    sustained_min: 60
  ea_damper_mismatch:
    kind: mismatch
    pos: EA_DMPR_POS
    cmd: EA_DMPR_CMD
    threshold: 0.05
    sustained_min: 60

  chwc_valve_leak:
    kind: leak
    pos: CHWC_VLV_POS
    cmd: CHWC_VLV_CMD
    idle_below: 0.02
    leak_above: 0.05
    sustained_min: 15
  hwc_valve_leak:
    kind: leak
    pos: HWC_VLV_POS
    cmd: HWC_VLV_CMD
    idle_below: 0.02
    leak_above: 0.05
    sustained_min: 15

  # Zone reheat valves: mismatch per zone (the pooled device class).
  # NOTE: position-based leak rules were REMOVED after positive controls
  # proved them structurally deaf here (the leak passes water through a
  # closed valve; position reads closed, honestly). rh_water_leak_* below
  # is the working leak detector.
  rh_valve_mismatch_I:
    kind: mismatch
    pos: RH_VLV_POS_I
    cmd: RH_VLV_CMD_I
    threshold: 0.05
    sustained_min: 60
    device: TU_I
  rh_valve_mismatch_W:
    kind: mismatch
    pos: RH_VLV_POS_W
    cmd: RH_VLV_CMD_W
    threshold: 0.05
    sustained_min: 60
    device: TU_W
  rh_valve_mismatch_S:
    kind: mismatch
    pos: RH_VLV_POS_S
    cmd: RH_VLV_CMD_S
    threshold: 0.05
    sustained_min: 60
    device: TU_S
  rh_valve_mismatch_E:
    kind: mismatch
    pos: RH_VLV_POS_E
    cmd: RH_VLV_CMD_E
    threshold: 0.05
    sustained_min: 60
    device: TU_E


  # Waterside leak: flow through a CLOSED reheat valve. The position-
  # based leak rule is deaf to this fault class (position reads closed,
  # honestly); water flow is the evidence. Positive-control verified.
  rh_water_leak_I:
    kind: leak
    pos: RH_FLOW_I
    cmd: RH_VLV_CMD_I
    idle_below: 0.02
    leak_above: 0.2    # healthy closed-valve flow maxes at 0.10 GPM (measured); 2x margin
    sustained_min: 15
    device: TU_I
  rh_water_leak_W:
    kind: leak
    pos: RH_FLOW_W
    cmd: RH_VLV_CMD_W
    idle_below: 0.02
    leak_above: 0.2    # healthy closed-valve flow maxes at 0.10 GPM (measured); 2x margin
    sustained_min: 15
    device: TU_W
  rh_water_leak_S:
    kind: leak
    pos: RH_FLOW_S
    cmd: RH_VLV_CMD_S
    idle_below: 0.02
    leak_above: 0.2    # healthy closed-valve flow maxes at 0.10 GPM (measured); 2x margin
    sustained_min: 15
    device: TU_S
  rh_water_leak_E:
    kind: leak
    pos: RH_FLOW_E
    cmd: RH_VLV_CMD_E
    idle_below: 0.02
    leak_above: 0.2    # healthy closed-valve flow maxes at 0.10 GPM (measured); 2x margin
    sustained_min: 15
    device: TU_E

  # Zone flow tracking: the ONLY handle on the command-less zone dampers via
  # rules — measured primary-air flow must track its setpoint while the AHU
  # is delivering air. Threshold to be validated by the healthy-silence gate.
  zone_flow_tracking_I:
    kind: setpoint_deviation
    meas: ZONE_FLOW_I
    sp: ZONE_FLOW_SP_I
    # healthy noise floor: sustained runs vanish above 25 CFM (measured,
    # FaultFree only); threshold = floor x 2 margin. Was 150 (margin 6x,
    # needlessly deaf: VAVDMPRStuck_20 132/365 days; at 50 it fires earlier).
    threshold: 50
    sustained_min: 60
    gate_signal: OCCUPIED
    gate_above: 0.5
    device: TU_I
  zone_flow_tracking_W:
    kind: setpoint_deviation
    meas: ZONE_FLOW_W
    sp: ZONE_FLOW_SP_W
    # healthy noise floor: sustained runs vanish above 25 CFM (measured,
    # FaultFree only); threshold = floor x 2 margin. Was 150 (margin 6x,
    # needlessly deaf: VAVDMPRStuck_20 132/365 days; at 50 it fires earlier).
    threshold: 50
    sustained_min: 60
    gate_signal: OCCUPIED
    gate_above: 0.5
    device: TU_W
  zone_flow_tracking_S:
    kind: setpoint_deviation
    meas: ZONE_FLOW_S
    sp: ZONE_FLOW_SP_S
    # healthy noise floor: sustained runs vanish above 25 CFM (measured,
    # FaultFree only); threshold = floor x 2 margin. Was 150 (margin 6x,
    # needlessly deaf: VAVDMPRStuck_20 132/365 days; at 50 it fires earlier).
    threshold: 50
    sustained_min: 60
    gate_signal: OCCUPIED
    gate_above: 0.5
    device: TU_S
  zone_flow_tracking_E:
    kind: setpoint_deviation
    meas: ZONE_FLOW_E
    sp: ZONE_FLOW_SP_E
    # healthy noise floor: sustained runs vanish above 25 CFM (measured,
    # FaultFree only); threshold = floor x 2 margin. Was 150 (margin 6x,
    # needlessly deaf: VAVDMPRStuck_20 132/365 days; at 50 it fires earlier).
    threshold: 50
    sustained_min: 60
    gate_signal: OCCUPIED
    gate_above: 0.5
    device: TU_E

  # Waterside heat-transfer residuals (fouling target; PCA confirmed the
  # signal exists). Display bands wide; DETECTION uses the calibrated
  # daily-median channel (residual_channels below).
  rh_waterside_dT_I:
    kind: paired_residual
    a: RH_EWT_I
    b: RH_LWT_I
    low: -900.0
    high: 900.0
    gates:
      - signal: RH_VLV_POS_I
        above: 0.10
      - signal: RH_FLOW_I
        above: 0.10
    occ_signal: OCCUPIED
    occ_above: 0.5
    sustained_min: 120
    device: TU_I
  rh_waterside_dT_W:
    kind: paired_residual
    a: RH_EWT_W
    b: RH_LWT_W
    low: -900.0
    high: 900.0
    gates:
      - signal: RH_VLV_POS_W
        above: 0.10
      - signal: RH_FLOW_W
        above: 0.10
    occ_signal: OCCUPIED
    occ_above: 0.5
    sustained_min: 120
    device: TU_W
  rh_waterside_dT_S:
    kind: paired_residual
    a: RH_EWT_S
    b: RH_LWT_S
    low: -900.0
    high: 900.0
    gates:
      - signal: RH_VLV_POS_S
        above: 0.10
      - signal: RH_FLOW_S
        above: 0.10
    occ_signal: OCCUPIED
    occ_above: 0.5
    sustained_min: 120
    device: TU_S
  rh_waterside_dT_E:
    kind: paired_residual
    a: RH_EWT_E
    b: RH_LWT_E
    low: -900.0
    high: 900.0
    gates:
      - signal: RH_VLV_POS_E
        above: 0.10
      - signal: RH_FLOW_E
        above: 0.10
    occ_signal: OCCUPIED
    occ_above: 0.5
    sustained_min: 120
    device: TU_E

  # Physics residuals (= APAR Rules 7 / 26-27, statistically calibrated).
  # The FPU AHU has BOTH coils, so the SA-MA residual needs both idle
  # (gates list). Band here is DISPLAY-ONLY for localization; detection uses
  # the per-day continuous channel calibrated blind on train days.
  supply_air_residual:
    kind: paired_residual
    a: SA_TEMP
    b: MA_TEMP
    low: -6.0
    high: 6.0
    gates:
      - signal: CHWC_VLV_POS
        below: 0.02
      - signal: HWC_VLV_POS
        below: 0.02
    occ_signal: OCCUPIED
    occ_above: 0.5        # occupied OR night-cycle: AHU active either way
    sustained_min: 120

  mixed_air_envelope:
    kind: envelope_residual
    signal: MA_TEMP
    low_ref: OA_TEMP
    high_ref: RA_TEMP
    tolerance: 2.0
    occ_signal: OCCUPIED
    occ_above: 0.5
    sustained_min: 60

  sat_setpoint_deviation:
    kind: setpoint_deviation
    meas: SA_TEMP
    sp: SA_TEMP_SP
    threshold: 2.0
    # healthy-silence tuning (FaultFree only): healthy >2F excursions last
    # at most 17 consecutive minutes; 30 silences them with ~2x margin
    sustained_min: 30
    gate_signal: CHWC_VLV_POS
    gate_above: 0.05

  # ---------------- X33b coverage audit (2026-09-25) ----------------
  # Bands from the fault-free file, occupied and supply fan on; quantiles (p0.1 / median / p99.9) logged per rule.
  # Supply fan specific power W/cfm: 0.548 / 0.679 / 0.706
  sf_specific_power:
    kind: paired_residual
    alphabet: signature
    op: ratio
    a: SF_POWER
    b: SA_FLOW
    low: 0.45
    high: 0.8
    gates:
      - signal: SF_STATUS
        above: 0.5
      - signal: SA_FLOW
        above: 50.0
    occ_signal: OCCUPIED
    sustained_min: 60
    residual_min_band_width: 0.01
    residual_min_exceedance: 0.01
  # Return fan specific power W/cfm: 0.314 / 0.483 / 0.783
  rf_specific_power:
    kind: paired_residual
    alphabet: signature
    op: ratio
    a: RF_POWER
    b: RA_FLOW
    low: 0.25
    high: 0.9
    gates:
      - signal: SF_STATUS
        above: 0.5
      - signal: RA_FLOW
        above: 50.0
    occ_signal: OCCUPIED
    sustained_min: 60
    residual_min_band_width: 0.01
    residual_min_exceedance: 0.01
  # Fan law, flow per unit speed: 1216 / 1246 / 2113
  sf_flow_per_speed:
    kind: paired_residual
    alphabet: signature
    op: ratio
    a: SA_FLOW
    b: SF_SPEED
    low: 1000.0
    high: 2400.0
    gates:
      - signal: SF_STATUS
        above: 0.5
      - signal: SF_SPEED
        above: 0.05
    occ_signal: OCCUPIED
    sustained_min: 60
    residual_min_band_width: 25.0
    residual_min_exceedance: 25.0
  # Fan law, static per speed^2 (X27 kind): 3.35 / 3.55 / 3.62
  static_per_speed2:
    kind: paired_residual
    alphabet: signature
    op: ratio_sq
    a: SA_STATIC
    b: SF_SPEED
    low: 3.0
    high: 4.0
    gates:
      - signal: SF_STATUS
        above: 0.5
      - signal: SF_SPEED
        above: 0.3
    occ_signal: OCCUPIED
    sustained_min: 60
    residual_min_band_width: 0.02
    residual_min_exceedance: 0.02
  # Cooling coil water-side rise, valve open: 8.1 / 10.0 / 30.0 F
  chwc_waterside_dT:
    kind: paired_residual
    alphabet: signature
    a: CHWC_LWT
    b: CHWC_EWT
    low: 5.0
    high: 32.0
    gates:
      - signal: CHWC_VLV_POS
        above: 0.05
    occ_signal: OCCUPIED
    sustained_min: 60
    residual_min_band_width: 0.5
    residual_min_exceedance: 0.5
  # Heating coil water-side drop, valve open (128 healthy minutes only): -74 / -56 / -48 F
  hwc_waterside_dT:
    kind: paired_residual
    alphabet: signature
    a: HWC_LWT
    b: HWC_EWT
    low: -80.0
    high: -40.0
    gates:
      - signal: HWC_VLV_POS
        above: 0.02
    occ_signal: OCCUPIED
    sustained_min: 60
    residual_min_band_width: 0.5
    residual_min_exceedance: 0.5
  # Return air minus zone I (return is the mix of the true zone temperatures): mean over zones 0.47 / 1.53 / 2.32 F
  ra_minus_zone_I:
    kind: paired_residual
    alphabet: signature
    a: RA_TEMP
    b: ZONE_TEMP_I
    low: -6.0
    high: 9.0
    gates:
      - signal: SF_STATUS
        above: 0.5
    occ_signal: OCCUPIED
    sustained_min: 60
    residual_min_band_width: 0.5
    residual_min_exceedance: 0.5
  # Return air minus zone W (return is the mix of the true zone temperatures): mean over zones 0.47 / 1.53 / 2.32 F
  ra_minus_zone_W:
    kind: paired_residual
    alphabet: signature
    a: RA_TEMP
    b: ZONE_TEMP_W
    low: -6.0
    high: 9.0
    gates:
      - signal: SF_STATUS
        above: 0.5
    occ_signal: OCCUPIED
    sustained_min: 60
    residual_min_band_width: 0.5
    residual_min_exceedance: 0.5
  # Return air minus zone S (return is the mix of the true zone temperatures): mean over zones 0.47 / 1.53 / 2.32 F
  ra_minus_zone_S:
    kind: paired_residual
    alphabet: signature
    a: RA_TEMP
    b: ZONE_TEMP_S
    low: -6.0
    high: 9.0
    gates:
      - signal: SF_STATUS
        above: 0.5
    occ_signal: OCCUPIED
    sustained_min: 60
    residual_min_band_width: 0.5
    residual_min_exceedance: 0.5
  # Return air minus zone E (return is the mix of the true zone temperatures): mean over zones 0.47 / 1.53 / 2.32 F
  ra_minus_zone_E:
    kind: paired_residual
    alphabet: signature
    a: RA_TEMP
    b: ZONE_TEMP_E
    low: -6.0
    high: 9.0
    gates:
      - signal: SF_STATUS
        above: 0.5
    occ_signal: OCCUPIED
    sustained_min: 60
    residual_min_band_width: 0.5
    residual_min_exceedance: 0.5
  # Zone I discharge minus supply air, reheat valve closed and zone fan off: 0 / 0 / 9.7 F
  dat_minus_sa_I:
    kind: paired_residual
    alphabet: signature
    a: ZONE_DAT_I
    b: SA_TEMP
    low: -2.0
    high: 12.0
    gates:
      - signal: SF_STATUS
        above: 0.5
      - signal: RH_VLV_POS_I
        below: 0.02
      - signal: ZONE_FAN_STATUS_I
        below: 0.5
    occ_signal: OCCUPIED
    sustained_min: 60
    residual_min_band_width: 0.5
    residual_min_exceedance: 0.5
  # Zone W discharge minus supply air, reheat valve closed and zone fan off: 0 / 0 / 9.7 F
  dat_minus_sa_W:
    kind: paired_residual
    alphabet: signature
    a: ZONE_DAT_W
    b: SA_TEMP
    low: -2.0
    high: 12.0
    gates:
      - signal: SF_STATUS
        above: 0.5
      - signal: RH_VLV_POS_W
        below: 0.02
      - signal: ZONE_FAN_STATUS_W
        below: 0.5
    occ_signal: OCCUPIED
    sustained_min: 60
    residual_min_band_width: 0.5
    residual_min_exceedance: 0.5
  # Zone S discharge minus supply air, reheat valve closed and zone fan off: 0 / 0 / 9.7 F
  dat_minus_sa_S:
    kind: paired_residual
    alphabet: signature
    a: ZONE_DAT_S
    b: SA_TEMP
    low: -2.0
    high: 12.0
    gates:
      - signal: SF_STATUS
        above: 0.5
      - signal: RH_VLV_POS_S
        below: 0.02
      - signal: ZONE_FAN_STATUS_S
        below: 0.5
    occ_signal: OCCUPIED
    sustained_min: 60
    residual_min_band_width: 0.5
    residual_min_exceedance: 0.5
  # Zone E discharge minus supply air, reheat valve closed and zone fan off: 0 / 0 / 9.7 F
  dat_minus_sa_E:
    kind: paired_residual
    alphabet: signature
    a: ZONE_DAT_E
    b: SA_TEMP
    low: -2.0
    high: 12.0
    gates:
      - signal: SF_STATUS
        above: 0.5
      - signal: RH_VLV_POS_E
        below: 0.02
      - signal: ZONE_FAN_STATUS_E
        below: 0.5
    occ_signal: OCCUPIED
    sustained_min: 60
    residual_min_band_width: 0.5
    residual_min_exceedance: 0.5
  # Zone I discharge minus primary airflow, zone fan off: -108 / -22 / -20 cfm
  da_minus_pm_I:
    kind: paired_residual
    alphabet: signature
    a: ZONE_DA_FLOW_I
    b: ZONE_FLOW_I
    low: -130.0
    high: 5.0
    gates:
      - signal: SF_STATUS
        above: 0.5
      - signal: ZONE_FAN_STATUS_I
        below: 0.5
    occ_signal: OCCUPIED
    sustained_min: 60
    residual_min_band_width: 5.0
    residual_min_exceedance: 5.0
  # Zone W discharge minus primary airflow, zone fan off: -108 / -22 / -20 cfm
  da_minus_pm_W:
    kind: paired_residual
    alphabet: signature
    a: ZONE_DA_FLOW_W
    b: ZONE_FLOW_W
    low: -130.0
    high: 5.0
    gates:
      - signal: SF_STATUS
        above: 0.5
      - signal: ZONE_FAN_STATUS_W
        below: 0.5
    occ_signal: OCCUPIED
    sustained_min: 60
    residual_min_band_width: 5.0
    residual_min_exceedance: 5.0
  # Zone S discharge minus primary airflow, zone fan off: -108 / -22 / -20 cfm
  da_minus_pm_S:
    kind: paired_residual
    alphabet: signature
    a: ZONE_DA_FLOW_S
    b: ZONE_FLOW_S
    low: -130.0
    high: 5.0
    gates:
      - signal: SF_STATUS
        above: 0.5
      - signal: ZONE_FAN_STATUS_S
        below: 0.5
    occ_signal: OCCUPIED
    sustained_min: 60
    residual_min_band_width: 5.0
    residual_min_exceedance: 5.0
  # Zone E discharge minus primary airflow, zone fan off: -108 / -22 / -20 cfm
  da_minus_pm_E:
    kind: paired_residual
    alphabet: signature
    a: ZONE_DA_FLOW_E
    b: ZONE_FLOW_E
    low: -130.0
    high: 5.0
    gates:
      - signal: SF_STATUS
        above: 0.5
      - signal: ZONE_FAN_STATUS_E
        below: 0.5
    occ_signal: OCCUPIED
    sustained_min: 60
    residual_min_band_width: 5.0
    residual_min_exceedance: 5.0
  # Duct static must track its setpoint while the supply fan runs. Occupied healthy |deviation| p99.9 is 0.17 in.wg; over ALL
  # fan-on minutes (the rule's gate) it is 1.38 with 1.9 % of minutes above 0.3, in runs of at most 3 minutes, so healthy
  # silence rests on sustained_min: 30 (review of X33b)
  static_setpoint_deviation:
    kind: setpoint_deviation
    alphabet: signature
    meas: SA_STATIC
    sp: SA_STATIC_SP
    threshold: 0.3
    sustained_min: 30
    gate_signal: SF_STATUS
    gate_above: 0.5
