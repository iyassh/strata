# LBNL field RTU (Site 2; Site 1 shares the column set). Units: degC, bar, W, CFM.
# OCCUPIED is the converter-derived FAN_ON (fan power > 100 W): the unit has no
# schedule point (X26 pre-registration). No damper, valve or command exists.
canonical_to_csv:
  OCCUPIED: FAN_ON
  FAN_POWER: RTU_SA_FAN_WATT
  COMP_POWER: RTU_COMP_WATT
  TOT_POWER: RTU_TOT_WATT
  SA_FLOW: RTU_SA_FLOW
  SA_TEMP: RTU_SA_TEMP
  MA_TEMP: RTU_MA_TEMP
  RA_TEMP: RTU_RA_TEMP
  OA_TEMP: RTU_OA_TEMP
  ZONE_TEMP: ZA_TEMP
  SA_HUMD: RTU_SA_HUM
  MA_HUMD: RTU_MA_HUM
  RA_HUMD: RTU_RA_HUM
  OA_HUMD: RTU_OA_HUM
  ZONE_HUMD: ZA_HUM
  COND_LA_TEMP: RTU_LA_COND_TEMP
  REFG_COND_TEMP_1: RTU_REFG_COND_TEMP_1
  REFG_COND_TEMP_2: RTU_REFG_COND_TEMP_2
  REFG_SUCT_TEMP_1: RTU_REFG_SUCT_TEMP_1
  REFG_SUCT_TEMP_2: RTU_REFG_SUCT_TEMP_2
  REFG_DISC_TEMP_1: RTU_REFG_DISC_TEMP_1
  REFG_DISC_TEMP_2: RTU_REFG_DISC_TEMP_2
  REFG_SUCT_PRES_1: RTU_REFG_SUCT_PRES_1
  REFG_SUCT_PRES_2: RTU_REFG_SUCT_PRES_2
  REFG_DISC_PRES_1: RTU_REFG_DISC_PRES_1
  REFG_DISC_PRES_2: RTU_REFG_DISC_PRES_2
  Datetime: Datetime
