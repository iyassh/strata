# LBNL simulated RTU (NREL Modelica-EnergyPlus, 5-ton). degF, Pa, W, cfm. OCCUPIED is the
# converter-derived OPERATE (= 1 every minute: no schedule, fan runs continuously; X29).
# RTU_SEN_CAPA / RTU_TOT_CAPA are simulation-only outputs and are deliberately NOT mapped.
canonical_to_csv:
  OCCUPIED: OPERATE
  COMP_STAGE: RTU_STG_STA
  COMP_POWER: RTU_COMP_WATT
  FAN_POWER: RTU_SA_FAN_WATT
  TOT_POWER: RTU_TOT_WATT
  SA_FLOW: RTU_SA_FLOW
  OA_FLOW: RTU_OA_FLOW
  RA_FLOW: RTU_RA_FLOW
  SA_TEMP: RTU_SA_TEMP
  RA_TEMP: RTU_RA_TEMP
  OA_TEMP: RTU_OA_TEMP
  ZONE_TEMP: ZA_TEMP
  ZONE_TEMP_SP: ZA_TEMP_SPT
  SA_HUMD: RTU_SA_HUM
  RA_HUMD: RTU_RA_HUM
  OA_HUMD: RTU_OA_HUM
  ZONE_HUMD: ZA_HUM
  REFG_COND_TEMP: RTU_REFG_COND_TEMP
  REFG_DISC_TEMP: RTU_REFG_DISC_TEMP
  REFG_SUCT_TEMP: RTU_REFG_SUCT_TEMP
  REFG_COND_PRES: RTU_REFG_COND_PRES
  REFG_DISC_PRES: RTU_REFG_DISC_PRES
  REFG_SUCT_PRES: RTU_REFG_SUCT_PRES
  Datetime: Datetime

# X33 coverage audit (2026-09-25): the two delivered-capacity outputs are simulation outputs no building records
# (X29 pre-registration excluded them from every rule); everything else is mapped. OPERATE is the converter's derived column.
coverage_audited: true
unmapped:
  RTU_SEN_CAPA: sensible capacity delivered — a simulation output no building records (X29 exclusion)
  RTU_TOT_CAPA: total capacity delivered — a simulation output no building records (X29 exclusion)

