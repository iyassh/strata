# Event-abstraction rules for the LBNL SDAHU dataset.
#
# Every rule is dispatched by its `kind`; the abstraction layer iterates THIS
# file, so adding a rule here adds it to the pipeline with no code change.
# `sustained_min` values are MINUTES of consecutive violation (converted to
# samples using the data's actual logging interval).
#
# Grounding: LBNL SDAHU documentation section 1.2 (ASHRAE Guideline 36-2020).

climate:
  ashrae_zone: 5A
  notes: "Chicago, IL TMY (humid). Documentation only; not read by code."

detection:
  # Per-day fault threshold is CALIBRATED on held-out healthy days at this
  # false-positive quantile (no hand-picked margins).
  fpr_quantile: 0.01
  # Last N days of each month are held out for threshold calibration;
  # the model is discovered from the remaining days.
  holdout_days_per_month: 8
  # X25: the 8 days before the holdout block calibrate the conformance thresholds,
  # so the holdout is out-of-sample for every channel (discovery trains on the rest)
  calibration_days_per_month: 8
  # ONE margin policy across all systems: exceedance floor since Phase 4
  # (audit C1); band-width floor added Phase 6 (gap S8) to match the FPU
  # configs. Numeric no-op here (calibrated band width 0.846 F > 0.5) —
  # verified by full re-run, byte-identical to the committed v12 artifact.
  residual_min_band_width: 0.5
  residual_min_exceedance: 0.5
  # X24: the default residual channel plus the outdoor-air-fraction residual
  residual_channels: [supply_air_residual, oa_fraction_residual, sf_specific_power, rf_specific_power, sf_flow_per_speed]
  # X33a: zone air temperatures read by the oscillation channel (healthy holdout exceedance 0/96 per zone)
  oscillation_signals: [ZONE_TEMP_1, ZONE_TEMP_2, ZONE_TEMP_3, ZONE_TEMP_4, ZONE_TEMP_5]
  oscillation_deadband: 0.5

events:
  occupancy:
    kind: occupancy
    alphabet: state
    signal: OCCUPIED
    on_event: system_started
    off_event: system_stopped

  cooling:
    kind: mode
    alphabet: state
    signal: CHWC_VLV_POS
    on_above: 0.05
    on_event: cooling_active
    off_event: cooling_inactive

  economizer:
    kind: window
    alphabet: state
    signal: OA_TEMP
    low: 33.8
    high: 60.0
    enter_event: economizer_window_entered
    exit_event: economizer_window_exited

  # Actuator command vs position mismatches (stuck actuators).
  # A healthy actuator mismatches only in brief transients; a stuck one
  # mismatches for hours, so 60 CONSECUTIVE minutes separates them cleanly.
  damper_command_mismatch:
    kind: mismatch
    alphabet: signature
    pos: OA_DMPR_POS
    cmd: OA_DMPR_CMD
    threshold: 0.05
    sustained_min: 60

  valve_command_mismatch:
    kind: mismatch
    alphabet: signature
    pos: CHWC_VLV_POS
    cmd: CHWC_VLV_CMD
    threshold: 0.05
    sustained_min: 60

  # Valve leaking: commanded (near-)closed but position open.
  # idle_below is an epsilon so a small idle command (dither/residue) does not
  # hide a real leak behind an exact-zero comparison.
  valve_leak:
    kind: leak
    alphabet: signature
    pos: CHWC_VLV_POS
    cmd: CHWC_VLV_CMD
    idle_below: 0.02
    leak_above: 0.05
    sustained_min: 15

  # ---- Analytic-redundancy rules (Phase 2) -------------------------------
  # Physics checks that catch faults producing NO sequence anomaly. A biased
  # sensor is invisible to behavioural rules: the controller trusts the
  # biased reading, so recorded values track setpoints and everything above
  # stays silent. But physics still binds the sensors to each other.
  #
  # Thresholds are grounded in the measured healthy distributions
  # (coil-off, occupied; see PHASE2_RESULTS.md): SA-MA residual is fan heat,
  # median +1.05F, p1 -2.18F, p99.9 +3.02F. The +-2C biases shift the
  # residual median to +-3.6F, the +-4C biases to +-7.2F.

  # With the cooling coil NOT controlling, supply air must equal mixed air
  # plus fan heat. A bias in the SA sensor appears verbatim in this residual.
  supply_air_residual:
    kind: paired_residual
    a: SA_TEMP
    b: MA_TEMP
    low: -2.6        # healthy p1 is -2.2; the -2C bias median sits at -3.6
    high: 3.3        # healthy p99.9 is +3.0; the +2C bias median sits at +3.6
    gate_signal: CHWC_VLV_POS
    gate_below: 0.02 # residual is only physics-bound while the coil is off
    occ_signal: OCCUPIED
    sustained_min: 120  # rides out coil-shutdown decay transients

  # Mixed air is a blend of outdoor and return air, so MA_TEMP must lie
  # between them (healthy occupied violation p99.9 = 0.13F; tolerance 2F).
  mixed_air_envelope:
    kind: envelope_residual
    signal: MA_TEMP
    low_ref: OA_TEMP
    high_ref: RA_TEMP
    tolerance: 2.0
    occ_signal: OCCUPIED
    sustained_min: 60

  # Return-air damper: third actuator with both wires; the mismatch kind is
  # reused unchanged — config only, no code.
  ra_damper_command_mismatch:
    kind: mismatch
    pos: RA_DMPR_POS
    cmd: RA_DMPR_CMD
    threshold: 0.05
    sustained_min: 60

  # Supply-air setpoint deviation, GATED on mechanical cooling being active:
  # G36 only guarantees SAT tracking while the cooling coil is controlling.
  # Ungated, this fired on ~95% of all days (winter drift; the AHU has no
  # heating coil) and carried no fault signal.
  setpoint_deviation:
    kind: setpoint_deviation
    alphabet: signature
    meas: SA_TEMP
    sp: SA_TEMP_SP
    threshold: 2.0
    sustained_min: 15
    gate_signal: CHWC_VLV_POS
    gate_above: 0.05

  # X24 (2026-09-24, pre-registered): outdoor-air fraction implied by the mixed-air
  # temperature, (RA-MA)/(RA-OA), minus the damper position; abstains where
  # |RA-OA| <= 10 F. Rule band +-0.25; residual channel band learned on healthy
  # with fraction-unit floors.
  oa_fraction_residual:
    kind: paired_residual
    alphabet: signature
    op: oa_fraction
    a: RA_TEMP
    b: MA_TEMP
    c: OA_TEMP
    pos: OA_DMPR_POS
    min_dT: 10.0
    low: -0.25
    high: 0.25
    occ_signal: OCCUPIED
    sustained_min: 60
    residual_min_band_width: 0.05
    residual_min_exceedance: 0.05

  # ---------------- X33a coverage audit (2026-09-25): fan side ----------------
  # Bands from the fault-free year only (occupied, fan commanded): quantiles logged here.
  # Supply fan specific power, W per cfm: healthy p0.1 7e-6, median 9.6e-4, p99.9 1.65e-3.
  sf_specific_power:
    kind: paired_residual
    alphabet: signature
    op: ratio
    a: SF_POWER
    b: SA_FLOW
    low: 0.0
    high: 0.0020
    gates:
      - signal: SF_CMD
        above: 0.5
      - signal: SA_FLOW
        above: 1000.0
    occ_signal: OCCUPIED
    sustained_min: 60
    residual_min_band_width: 0.0001
    residual_min_exceedance: 0.0001
  # Return fan specific power: healthy p0.1 1e-6, median 2.2e-4, p99.9 4.3e-4.
  rf_specific_power:
    kind: paired_residual
    alphabet: signature
    op: ratio
    a: RF_POWER
    b: RA_FLOW
    low: 0.0
    high: 0.0006
    gates:
      - signal: RF_CMD
        above: 0.5
      - signal: RA_FLOW
        above: 1000.0
    occ_signal: OCCUPIED
    sustained_min: 60
    residual_min_band_width: 0.00003
    residual_min_exceedance: 0.00003
  # Fan law, flow proportional to speed: SA_FLOW / SF_SPEED_CMD, healthy p0.1 5.72e5, median 7.88e5, p99.9 1.27e6
  # (the file's flow unit is ~1000x cfm). Silence iteration 1: bands were logged /1000 by mistake and fired daily; corrected.
  sf_flow_per_speed:
    kind: paired_residual
    alphabet: signature
    op: ratio
    a: SA_FLOW
    b: SF_SPEED_CMD
    low: 450000.0
    high: 1400000.0
    gates:
      - signal: SF_CMD
        above: 0.5
      - signal: SF_SPEED_CMD
        above: 0.05
    occ_signal: OCCUPIED
    sustained_min: 60
    residual_min_band_width: 20000.0
    residual_min_exceedance: 20000.0
  # Return fan speed position must track its command (identical columns in the fault-free year).
  rf_speed_mismatch:
    kind: mismatch
    pos: RF_SPEED_POS
    cmd: RF_SPEED_CMD
    threshold: 0.05
    sustained_min: 60
