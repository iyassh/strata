<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="560" viewBox="0 0 1400 560">
<defs><marker id="ah" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/></marker></defs>
<rect width="1400" height="560" fill="white"/>
<rect x="20" y="20" width="1360" height="245" rx="12" fill="#f3f6fb" stroke="#c3cad6" stroke-width="1.2"/>
<text x="36" y="46" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#1f2937">A  TRAINING, once per building, on one fault-free period</text>
<rect x="40" y="70" width="250" height="170" rx="8" fill="white" stroke="#8a94a6" stroke-width="1.2"/>
<rect x="330" y="70" width="290" height="170" rx="8" fill="white" stroke="#8a94a6" stroke-width="1.2"/>
<rect x="660" y="70" width="300" height="170" rx="8" fill="white" stroke="#8a94a6" stroke-width="1.2"/>
<rect x="1000" y="70" width="360" height="170" rx="8" fill="white" stroke="#8a94a6" stroke-width="1.2"/>
<text x="52" y="94" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#1f2937">1  Trend data + configuration file</text>
<text x="52" y="116" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#374151">Temperatures, flows, pressures,</text>
<text x="52" y="133" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#374151">damper and valve positions, fan</text>
<text x="52" y="150" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#374151">speeds, usually once a minute.</text>
<text x="52" y="167" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#374151"></text>
<text x="52" y="184" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#374151">The configuration file maps sensor</text>
<text x="52" y="201" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#374151">names to roles and lists the control</text>
<text x="52" y="218" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#374151">sequence as rules. It is the only</text>
<text x="52" y="235" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#374151">building-specific part.</text>
<text x="342" y="94" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#1f2937">2  Events along the control sequence</text>
<text x="342" y="116" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#374151">Each day is one case.</text>
<text x="342" y="116" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#374151"></text>
<text x="342" y="133" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#374151">State events: what the equipment is</text>
<text x="342" y="150" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#374151">doing (“cooling started at 09:14”).</text>
<text x="342" y="167" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#374151"></text>
<text x="342" y="184" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#374151">Signature events: something that</text>
<text x="342" y="201" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#374151">should not happen (“flow through</text>
<text x="342" y="218" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#374151">a closed valve”). Never used for</text>
<text x="342" y="235" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#374151">model discovery.</text>
<text x="672" y="94" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#1f2937">3  Process models of a normal day</text>
<text x="672" y="116" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#374151">Discovered from the state events</text>
<text x="672" y="133" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#374151">only, so the models cannot learn</text>
<text x="672" y="150" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#374151">our own fault rules.</text>
<text x="672" y="167" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#374151"></text>
<text x="672" y="184" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#374151">Device level: one model per</text>
<text x="672" y="201" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#374151">terminal unit.</text>
<text x="672" y="218" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#374151">Unit level: one model for the air</text>
<text x="672" y="235" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#374151">handler’s whole day.</text>
<text x="1012" y="94" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#1f2937">4a  Calibrate the eight checks</text>
<text x="1012" y="116" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#374151">The last eight days of each month</text>
<text x="1012" y="133" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#374151">(96 in a year) are held out and used</text>
<text x="1012" y="150" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#374151">only to measure each check’s</text>
<text x="1012" y="167" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#374151">false-alarm rate, the rate reported</text>
<text x="1012" y="184" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#374151">with every alarm.</text>
<text x="1012" y="201" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#374151"></text>
<text x="1012" y="218" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#374151">Healthy bands and model thresholds</text>
<text x="1012" y="235" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#374151">are set on the other days.</text>
<line x1="290" y1="155" x2="330" y2="155" stroke="#4b5563" stroke-width="1.8" marker-end="url(#ah)"/>
<line x1="620" y1="155" x2="660" y2="155" stroke="#4b5563" stroke-width="1.8" marker-end="url(#ah)"/>
<line x1="960" y1="155" x2="1000" y2="155" stroke="#4b5563" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="20" y="285" width="1360" height="255" rx="12" fill="#f7f7f2" stroke="#c3cad6" stroke-width="1.2"/>
<text x="36" y="311" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#1f2937">B  DEPLOYMENT, every day</text>
<rect x="40" y="335" width="200" height="180" rx="8" fill="white" stroke="#8a94a6" stroke-width="1.2"/>
<text x="52" y="359" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#1f2937">(2)  New day of data</text>
<text x="52" y="381" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#374151">Turned into events</text>
<text x="52" y="398" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#374151">with the same</text>
<text x="52" y="415" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#374151">configuration.</text>
<rect x="280" y="335" width="620" height="180" rx="8" fill="white" stroke="#8a94a6" stroke-width="1.2"/>
<text x="292" y="359" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#1f2937">4b  The eight checks, each against its own healthy band</text>
<text x="292" y="384" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="start" fill="#6b7280">Read the raw sensors</text>
<text x="292" y="403" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#374151">Rules: a control-sequence rule broken</text>
<text x="292" y="419" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#374151">Residual: a physical relation drifted</text>
<text x="292" y="435" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#374151">Oscillation: actuator reversing too often</text>
<text x="600" y="384" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="start" fill="#6b7280">Read the event log</text>
<text x="600" y="403" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#374151">Unit conformance: day fits unit model</text>
<text x="600" y="419" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#374151">Device conformance: day fits device model</text>
<text x="600" y="435" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#374151">Absence: expected device silent</text>
<text x="600" y="451" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#374151">Frequency: a daily count out of range</text>
<text x="292" y="478" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#374151">Rate (support only): a mode’s 30-day activity against the same calendar month of the fault-free year</text>
<rect x="940" y="335" width="180" height="180" rx="8" fill="white" stroke="#8a94a6" stroke-width="1.2"/>
<text x="952" y="359" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#1f2937">5  Noise gate</text>
<text x="952" y="381" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#374151">A check may alarm</text>
<text x="952" y="398" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#374151">only when its flags</text>
<text x="952" y="415" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#374151">exceed what its own</text>
<text x="952" y="432" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#374151">false-alarm rate</text>
<text x="952" y="449" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#374151">would produce by</text>
<text x="952" y="466" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#374151">chance; the rate is</text>
<text x="952" y="483" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#374151">never taken below</text>
<text x="952" y="500" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#374151">3 days in 96.</text>
<rect x="1160" y="335" width="200" height="180" rx="8" fill="#1e3a5f" stroke="#1e3a5f" stroke-width="1.2"/>
<text x="1172" y="359" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="white">6  Alarm to the operator</text>
<text x="1172" y="381" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="white">What broke</text>
<text x="1172" y="398" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="white">Where (unit, terminal</text>
<text x="1172" y="415" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="white">unit, zone)</text>
<text x="1172" y="432" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="white">Evidence (values and</text>
<text x="1172" y="449" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="white">duration)</text>
<text x="1172" y="466" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="white">The check’s measured</text>
<text x="1172" y="483" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="white">false-alarm rate</text>
<line x1="240" y1="425" x2="280" y2="425" stroke="#4b5563" stroke-width="1.8" marker-end="url(#ah)"/>
<line x1="900" y1="425" x2="940" y2="425" stroke="#4b5563" stroke-width="1.8" marker-end="url(#ah)"/>
<line x1="1120" y1="425" x2="1160" y2="425" stroke="#4b5563" stroke-width="1.8" marker-end="url(#ah)"/>
<line x1="810" y1="240" x2="810" y2="335" stroke="#9ca3af" stroke-width="1.8" marker-end="url(#ah)"/>
<text x="830" y="300" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#6b7280">models and thresholds from A</text>
<line x1="1180" y1="240" x2="1030" y2="335" stroke="#9ca3af" stroke-width="1.8" marker-end="url(#ah)"/>
<text x="1040" y="300" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#6b7280">false-alarm rates from A</text>
</svg>