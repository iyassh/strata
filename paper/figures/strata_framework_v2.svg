<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1100 700" width="1100" height="700" xmlns="http://www.w3.org/2000/svg"
       font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
    <defs>
      <marker id="ar" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto">
        <path d="M0,1 L9,5 L0,9 Z" fill="#40474F"/>
      </marker>
      <marker id="arB" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto">
        <path d="M0,1 L9,5 L0,9 Z" fill="#B06A2A"/>
      </marker>
      <marker id="arBlue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto">
        <path d="M0,1 L9,5 L0,9 Z" fill="#2F5D8A"/>
      </marker>
    </defs>

    <!-- ═══════════════ PHASE A : TRAINING ═══════════════ -->
    <rect x="24" y="30" width="1052" height="268" rx="6" fill="#F7F8F6" stroke="#B9BFB8" stroke-width="1.2"/>
    <text x="44" y="58" font-size="14" font-weight="700" letter-spacing="0.8" fill="#40474F">A&#8195;TRAINING — learn normal behaviour from one fault-free year</text>

    <!-- A1 input -->
    <g>
      <rect x="48" y="98" width="164" height="150" rx="3" fill="#FFFFFF" stroke="#40474F" stroke-width="1.3"/>
      <circle cx="64" cy="114" r="10" fill="#40474F"/><text x="64" y="118.5" text-anchor="middle" font-size="11" font-weight="700" fill="#FFF">1</text>
      <text x="130" y="126" text-anchor="middle" font-size="13.5" font-weight="600" fill="#23282E">Building data</text>
      <line x1="62" y1="140" x2="198" y2="140" stroke="#D8D6CC"/>
      <text x="62" y="160" font-size="11.5" fill="#23282E">BMS sensor trends,</text>
      <text x="62" y="176" font-size="11.5" fill="#23282E">one fault-free year</text>
      <text x="62" y="200" font-size="11.5" fill="#23282E">One config file per</text>
      <text x="62" y="216" font-size="11.5" fill="#23282E">building (sensors + rules)</text>
      <text x="62" y="236" font-size="10.5" font-style="italic" fill="#6A7069">the only site-specific part</text>
    </g>

    <!-- A2 abstraction -->
    <g>
      <rect x="256" y="98" width="176" height="150" rx="3" fill="#FFFFFF" stroke="#40474F" stroke-width="1.3"/>
      <circle cx="272" cy="114" r="10" fill="#40474F"/><text x="272" y="118.5" text-anchor="middle" font-size="11" font-weight="700" fill="#FFF">2</text>
      <text x="344" y="126" text-anchor="middle" font-size="13.5" font-weight="600" fill="#23282E">Event abstraction</text>
      <line x1="270" y1="140" x2="418" y2="140" stroke="#D8D6CC"/>
      <text x="344" y="160" text-anchor="middle" font-size="11.5" fill="#23282E">sensor series → typed events,</text>
      <text x="344" y="176" text-anchor="middle" font-size="11.5" fill="#23282E">split into two alphabets:</text>
      <rect x="270" y="188" width="140" height="22" rx="2" fill="#EAF0F7" stroke="#2F5D8A"/>
      <text x="340" y="203" text-anchor="middle" font-size="11" fill="#2F5D8A" font-weight="600">state events</text>
      <rect x="270" y="216" width="140" height="22" rx="2" fill="#FAF1E6" stroke="#B06A2A"/>
      <text x="340" y="231" text-anchor="middle" font-size="11" fill="#B06A2A" font-weight="600">fault-signature events</text>
    </g>

    <!-- A3 discover -->
    <g>
      <rect x="486" y="78" width="264" height="186" rx="3" fill="#EAF0F7" stroke="#2F5D8A" stroke-width="1.6"/>
      <circle cx="502" cy="94" r="10" fill="#2F5D8A"/><text x="502" y="98.5" text-anchor="middle" font-size="11" font-weight="700" fill="#FFF">3</text>
      <text x="618" y="106" text-anchor="middle" font-size="13.5" font-weight="700" fill="#2F5D8A">DISCOVER  process models</text>
      <line x1="500" y1="120" x2="736" y2="120" stroke="#B9CADD"/>
      <rect x="502" y="132" width="232" height="30" rx="2" fill="#FFFFFF" stroke="#2F5D8A"/>
      <text x="618" y="151" text-anchor="middle" font-size="11.5" fill="#23282E">Device stratum — component lifecycles</text>
      <rect x="502" y="168" width="232" height="30" rx="2" fill="#FFFFFF" stroke="#2F5D8A"/>
      <text x="618" y="187" text-anchor="middle" font-size="11.5" fill="#23282E">Unit stratum — daily operating cycle</text>
      <rect x="502" y="204" width="232" height="30" rx="2" fill="#FFFFFF" stroke="#2F5D8A"/>
      <text x="618" y="223" text-anchor="middle" font-size="11.5" fill="#23282E">System stratum — cross-system grammar</text>
      <text x="618" y="252" text-anchor="middle" font-size="11" font-style="italic" fill="#2F5D8A">the models locate the invariants of normal operation</text>
    </g>

    <!-- A4 calibrate -->
    <g>
      <rect x="804" y="78" width="248" height="186" rx="3" fill="#FFFFFF" stroke="#40474F" stroke-width="1.3"/>
      <circle cx="820" cy="94" r="10" fill="#40474F"/><text x="820" y="98.5" text-anchor="middle" font-size="11" font-weight="700" fill="#FFF">4</text>
      <text x="928" y="106" text-anchor="middle" font-size="13.5" font-weight="700" fill="#23282E">CALIBRATE  channels</text>
      <line x1="818" y1="120" x2="1038" y2="120" stroke="#D8D6CC"/>
      <text x="820" y="142" font-size="11.5" fill="#23282E">· physics rules (APAR lineage)</text>
      <text x="820" y="162" font-size="11.5" fill="#23282E">· temperature-residual bands</text>
      <text x="820" y="182" font-size="11.5" fill="#23282E">· model-conformance thresholds</text>
      <text x="820" y="202" font-size="11.5" fill="#23282E">· activity frequency &amp; oscillation</text>
      <text x="820" y="230" font-size="11" font-style="italic" fill="#6A7069">every channel earns a measured</text>
      <text x="820" y="245" font-size="11" font-style="italic" fill="#6A7069">false-alarm floor, on training data only</text>
    </g>

    <!-- ═══════════════ PHASE B : DEPLOYMENT ═══════════════ -->
    <rect x="24" y="330" width="1052" height="268" rx="6" fill="#F7F8F6" stroke="#B9BFB8" stroke-width="1.2"/>
    <text x="44" y="358" font-size="14" font-weight="700" letter-spacing="0.8" fill="#40474F">B&#8195;DEPLOYMENT — score each new day</text>

    <!-- B1 new data -->
    <g>
      <rect x="48" y="398" width="164" height="150" rx="3" fill="#FFFFFF" stroke="#40474F" stroke-width="1.3"/>
      <circle cx="64" cy="414" r="10" fill="#40474F"/><text x="64" y="418.5" text-anchor="middle" font-size="11" font-weight="700" fill="#FFF">5</text>
      <text x="130" y="426" text-anchor="middle" font-size="13.5" font-weight="600" fill="#23282E">New day of data</text>
      <line x1="62" y1="440" x2="198" y2="440" stroke="#D8D6CC"/>
      <text x="62" y="460" font-size="11.5" fill="#23282E">same sensors, abstracted</text>
      <text x="62" y="476" font-size="11.5" fill="#23282E">into the same events</text>
    </g>

    <!-- B2 evaluate -->
    <g>
      <rect x="256" y="378" width="494" height="190" rx="3" fill="#FFFFFF" stroke="#40474F" stroke-width="1.3"/>
      <circle cx="272" cy="394" r="10" fill="#40474F"/><text x="272" y="398.5" text-anchor="middle" font-size="11" font-weight="700" fill="#FFF">6</text>
      <text x="503" y="406" text-anchor="middle" font-size="13.5" font-weight="700" fill="#23282E">EVALUATE  eight interpretable channels</text>
      <line x1="270" y1="420" x2="736" y2="420" stroke="#D8D6CC"/>

      <text x="292" y="444" font-size="11" font-weight="700" letter-spacing="0.5" fill="#B06A2A">PHYSICS</text>
      <rect x="286" y="452" width="130" height="24" rx="2" fill="#FAF1E6" stroke="#B06A2A"/>
      <text x="351" y="468" text-anchor="middle" font-size="11" fill="#23282E">signature rules</text>
      <rect x="286" y="482" width="130" height="24" rx="2" fill="#FAF1E6" stroke="#B06A2A"/>
      <text x="351" y="498" text-anchor="middle" font-size="11" fill="#23282E">residual bands</text>

      <text x="450" y="444" font-size="11" font-weight="700" letter-spacing="0.5" fill="#2F5D8A">CONFORMANCE TO MODELS</text>
      <rect x="444" y="452" width="130" height="24" rx="2" fill="#EAF0F7" stroke="#2F5D8A"/>
      <text x="509" y="468" text-anchor="middle" font-size="11" fill="#23282E">unit conformance</text>
      <rect x="444" y="482" width="130" height="24" rx="2" fill="#EAF0F7" stroke="#2F5D8A"/>
      <text x="509" y="498" text-anchor="middle" font-size="11" fill="#23282E">device conformance</text>
      <rect x="444" y="512" width="130" height="24" rx="2" fill="#EAF0F7" stroke="#2F5D8A"/>
      <text x="509" y="528" text-anchor="middle" font-size="11" fill="#23282E">expected-activity absence</text>

      <text x="608" y="444" font-size="11" font-weight="700" letter-spacing="0.5" fill="#40474F">STATISTICS</text>
      <rect x="602" y="452" width="130" height="24" rx="2" fill="#F2F3F1" stroke="#40474F"/>
      <text x="667" y="468" text-anchor="middle" font-size="11" fill="#23282E">activity frequency</text>
      <rect x="602" y="482" width="130" height="24" rx="2" fill="#F2F3F1" stroke="#40474F"/>
      <text x="667" y="498" text-anchor="middle" font-size="11" fill="#23282E">oscillation</text>
      <rect x="602" y="512" width="130" height="24" rx="2" fill="#F2F3F1" stroke="#40474F" stroke-dasharray="4 3"/>
      <text x="667" y="528" text-anchor="middle" font-size="11" fill="#6A7069">seasonal rate †</text>

      <text x="292" y="554" font-size="10.5" font-style="italic" fill="#6A7069">† corroborates a raised alarm; never raises one alone</text>
    </g>

    <!-- B3 gate -->
    <g>
      <rect x="792" y="398" width="132" height="150" rx="3" fill="#F2F3F1" stroke="#40474F" stroke-width="1.5"/>
      <circle cx="808" cy="414" r="10" fill="#40474F"/><text x="808" y="418.5" text-anchor="middle" font-size="11" font-weight="700" fill="#FFF">7</text>
      <text x="858" y="428" text-anchor="middle" font-size="13" font-weight="700" fill="#23282E">Noise gate</text>
      <line x1="806" y1="440" x2="910" y2="440" stroke="#D8D6CC"/>
      <text x="858" y="462" text-anchor="middle" font-size="11" fill="#23282E">a channel reports</text>
      <text x="858" y="477" text-anchor="middle" font-size="11" fill="#23282E">only what exceeds</text>
      <text x="858" y="492" text-anchor="middle" font-size="11" fill="#23282E">its own measured</text>
      <text x="858" y="507" text-anchor="middle" font-size="11" fill="#23282E">false-alarm floor</text>
    </g>

    <!-- B4 output -->
    <g>
      <rect x="948" y="378" width="128" height="190" rx="3" fill="#2F5D8A"/>
      <circle cx="964" cy="394" r="10" fill="#FFFFFF"/><text x="964" y="398.5" text-anchor="middle" font-size="11" font-weight="700" fill="#2F5D8A">8</text>
      <text x="1012" y="412" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">Explained</text>
      <text x="1012" y="428" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">alarm</text>
      <line x1="962" y1="442" x2="1062" y2="442" stroke="#5B82A8"/>
      <text x="1012" y="464" text-anchor="middle" font-size="11.5" fill="#DCE7F2">fault name</text>
      <text x="1012" y="486" text-anchor="middle" font-size="11.5" fill="#DCE7F2">physical explanation</text>
      <text x="1012" y="508" text-anchor="middle" font-size="11.5" fill="#DCE7F2">device / zone</text>
      <text x="1012" y="530" text-anchor="middle" font-size="11.5" fill="#DCE7F2">false-positive budget</text>
    </g>

    <!-- ═══════════════ ARROWS ═══════════════ -->
    <g stroke="#40474F" stroke-width="1.4" fill="none">
      <line x1="212" y1="173" x2="256" y2="173" marker-end="url(#ar)"/>
      <line x1="750" y1="171" x2="804" y2="171" marker-end="url(#ar)"/>
      <line x1="212" y1="473" x2="256" y2="473" marker-end="url(#ar)"/>
      <line x1="750" y1="473" x2="792" y2="473" marker-end="url(#ar)"/>
      <line x1="924" y1="473" x2="948" y2="473" marker-end="url(#ar)"/>
    </g>
    <!-- state events -> discover -->
    <path d="M410,199 C452,199 448,171 486,171" stroke="#2F5D8A" stroke-width="1.5" fill="none" marker-end="url(#arBlue)"/>
    <!-- signature events -> calibrate (skip discovery) -->
    <path d="M410,227 C460,227 500,286 618,286 C740,286 766,220 804,213" stroke="#B06A2A" stroke-width="1.5"
          stroke-dasharray="6 4" fill="none" marker-end="url(#arB)"/>
    <text x="618" y="280" text-anchor="middle" font-size="10.5" font-style="italic" fill="#B06A2A">signature events skip model discovery — the models can never re-detect their own rules</text>
    <!-- discover informs calibrate -->
    <line x1="750" y1="140" x2="804" y2="140" stroke="#2F5D8A" stroke-width="1.5" marker-end="url(#arBlue)"/>
    <text x="777" y="132" text-anchor="middle" font-size="10.5" font-style="italic" fill="#2F5D8A">where</text>

    <!-- training -> deployment (models + thresholds flow down) -->
    <g stroke="#2F5D8A" stroke-width="1.5" fill="none">
      <line x1="618" y1="264" x2="618" y2="308" />
      <line x1="928" y1="264" x2="928" y2="308" />
      <path d="M618,308 L618,318 M928,308 L928,318" />
      <line x1="618" y1="318" x2="565" y2="378" marker-end="url(#arBlue)"/>
      <line x1="928" y1="318" x2="700" y2="378" marker-end="url(#arBlue)"/>
    </g>
    <text x="796" y="322" text-anchor="middle" font-size="10.5" font-style="italic" fill="#2F5D8A">discovered models + calibrated thresholds</text>

    <!-- ═══════════════ FOOT ═══════════════ -->
    <line x1="24" y1="622" x2="1076" y2="622" stroke="#D8D6CC"/>
    <text x="550" y="646" text-anchor="middle" font-size="12" fill="#6A7069">Validated on three LBNL benchmark systems — 13/14 · 23/30 · 24/29 fault scenarios detected, median time-to-detect 1 day, joint false-alarm budget 1.0–5.2%.</text>
    <g font-size="11" fill="#6A7069">
      <rect x="330" y="662" width="14" height="14" rx="2" fill="#EAF0F7" stroke="#2F5D8A"/>
      <text x="352" y="673.5">discovered process models</text>
      <rect x="530" y="662" width="14" height="14" rx="2" fill="#FAF1E6" stroke="#B06A2A"/>
      <text x="552" y="673.5">physics / fault-signature path</text>
      <line x1="726" y1="669" x2="756" y2="669" stroke="#B06A2A" stroke-width="1.5" stroke-dasharray="6 4"/>
      <text x="764" y="673.5">excluded from discovery</text>
    </g>
  </svg>
