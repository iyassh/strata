<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1040 400" width="1040" height="400" xmlns="http://www.w3.org/2000/svg"
       font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
    <defs>
      <marker id="ar" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto">
        <path d="M0,1 L9,5 L0,9 Z" fill="#3A424C"/>
      </marker>
      <marker id="arB" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto">
        <path d="M0,1 L9,5 L0,9 Z" fill="#A8642B"/>
      </marker>
    </defs>

    <!-- ================= INPUT ================= -->
    <rect x="20" y="140" width="150" height="90" rx="2" fill="#FFFFFF" stroke="#3A424C" stroke-width="1.3"/>
    <text x="95" y="176" text-anchor="middle" font-size="14" font-weight="600" fill="#23282E">One fault-free year</text>
    <text x="95" y="195" text-anchor="middle" font-size="12" fill="#6A7069">BMS sensor trends</text>
    <text x="95" y="212" text-anchor="middle" font-size="12" fill="#6A7069">+ one config file</text>

    <!-- ================= EVENT ABSTRACTION ================= -->
    <rect x="222" y="140" width="150" height="90" rx="2" fill="#FFFFFF" stroke="#3A424C" stroke-width="1.3"/>
    <text x="297" y="176" text-anchor="middle" font-size="14" font-weight="600" fill="#23282E">Event abstraction</text>
    <text x="297" y="195" text-anchor="middle" font-size="12" fill="#6A7069">sensor series →</text>
    <text x="297" y="212" text-anchor="middle" font-size="12" fill="#6A7069">typed events</text>

    <!-- ================= DISCOVER (top path) ================= -->
    <rect x="436" y="52" width="240" height="104" rx="2" fill="#EDF2F8" stroke="#33608F" stroke-width="1.6"/>
    <text x="556" y="82" text-anchor="middle" font-size="15" font-weight="700" fill="#33608F">DISCOVER</text>
    <text x="556" y="103" text-anchor="middle" font-size="12.5" fill="#23282E">process models of normal operation</text>
    <text x="556" y="122" text-anchor="middle" font-size="12.5" fill="#23282E">at three levels: device · unit · system</text>
    <text x="556" y="143" text-anchor="middle" font-size="11.5" font-style="italic" fill="#33608F">models locate the invariants</text>

    <!-- ================= CALIBRATE (bottom path) ================= -->
    <rect x="436" y="216" width="240" height="104" rx="2" fill="#FFFFFF" stroke="#3A424C" stroke-width="1.3"/>
    <text x="556" y="246" text-anchor="middle" font-size="15" font-weight="700" fill="#23282E">CALIBRATE</text>
    <text x="556" y="267" text-anchor="middle" font-size="12.5" fill="#23282E">interpretable channels: physics rules,</text>
    <text x="556" y="286" text-anchor="middle" font-size="12.5" fill="#23282E">residuals, conformance, frequency</text>
    <text x="556" y="307" text-anchor="middle" font-size="11.5" font-style="italic" fill="#6A7069">each earns a measured false-alarm floor</text>

    <!-- ================= DETECT ================= -->
    <rect x="740" y="140" width="150" height="90" rx="2" fill="#FFFFFF" stroke="#3A424C" stroke-width="1.3"/>
    <text x="815" y="172" text-anchor="middle" font-size="14" font-weight="600" fill="#23282E">Detect</text>
    <text x="815" y="191" text-anchor="middle" font-size="12" fill="#6A7069">flag only what beats</text>
    <text x="815" y="208" text-anchor="middle" font-size="12" fill="#6A7069">its own noise floor</text>

    <!-- ================= OUTPUT ================= -->
    <rect x="922" y="128" width="100" height="114" rx="2" fill="#33608F"/>
    <text x="972" y="158" text-anchor="middle" font-size="13.5" font-weight="700" fill="#FFFFFF">Alarm with</text>
    <text x="972" y="180" text-anchor="middle" font-size="12.5" fill="#DCE7F2">a name</text>
    <text x="972" y="199" text-anchor="middle" font-size="12.5" fill="#DCE7F2">an explanation</text>
    <text x="972" y="218" text-anchor="middle" font-size="12.5" fill="#DCE7F2">an FP budget</text>

    <!-- ================= ARROWS ================= -->
    <g stroke="#3A424C" stroke-width="1.4" fill="none">
      <line x1="170" y1="185" x2="222" y2="185" marker-end="url(#ar)"/>
      <!-- split up to DISCOVER -->
      <path d="M372,167 C400,167 404,104 436,104" marker-end="url(#ar)"/>
      <!-- DISCOVER informs CALIBRATE -->
      <path d="M556,156 L556,216" marker-end="url(#ar)"/>
      <!-- CALIBRATE to DETECT -->
      <path d="M676,268 C708,268 712,203 740,203" marker-end="url(#ar)"/>
      <!-- DETECT to OUTPUT -->
      <line x1="890" y1="185" x2="922" y2="185" marker-end="url(#ar)"/>
    </g>

    <!-- split labels -->
    <text x="404" y="120" text-anchor="middle" font-size="11" fill="#33608F">state</text>
    <text x="404" y="134" text-anchor="middle" font-size="11" fill="#33608F">events</text>

    <!-- signature bypass -->
    <path d="M372,203 C400,203 404,268 436,268" stroke="#A8642B" stroke-width="1.4"
          fill="none" stroke-dasharray="6 4" marker-end="url(#arB)"/>
    <text x="404" y="250" text-anchor="middle" font-size="11" fill="#A8642B">signature</text>
    <text x="404" y="264" text-anchor="middle" font-size="11" fill="#A8642B">events</text>

    <!-- discover→calibrate label -->
    <text x="568" y="192" font-size="11" fill="#33608F" font-style="italic">where to look</text>

    <!-- ================= bottom annotation line ================= -->
    <line x1="20" y1="356" x2="1022" y2="356" stroke="#D8D6CC" stroke-width="1"/>
    <text x="521" y="381" text-anchor="middle" font-size="12" fill="#6A7069">
      Validated on three LBNL benchmark systems: 13/14 · 23/30 · 24/29 fault scenarios, median detection in 1 day, 1.0–5.2% joint false-alarm budget.
    </text>

    <!-- dashed separation note: kept as the ONE methodological callout -->
    <text x="297" y="130" text-anchor="middle" font-size="10.5" fill="#A8642B" font-style="italic"></text>
  </svg>
