[project]
name = "processheal"
version = "0.1.0"
description = "Process mining for fault detection and diagnosis in building HVAC systems"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.5.4",
    "fastapi>=0.138.0",
    "graphviz>=0.21",
    "matplotlib>=3.11.0",
    "pandas>=3.0.3",
    "pm4py>=2.7.22.5",
    "pyarrow>=24.0.0",
    "pyyaml>=6.0.3",
    "rdflib>=7.6.0",
    "typer>=0.26.7",
    "uvicorn>=0.49.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/processheal"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.19",
]

[project.scripts]
processheal = "processheal.cli:app"
processheal-web = "processheal.web.app:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["integration: tests that need the real Parquet data"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint.per-file-ignores]
# scripts set TQDM/warnings env state before importing the pipeline
"scripts/*" = ["E402"]
